name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ NL-beta ]

jobs:
  build:
    # Pinned so the Ubuntu 26 switch of "ubuntu-latest" (Oct 2026) can't break builds.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Fix gradlew line endings and grant execute permission
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      # Forced to compile Debug instead of failing on empty upstream secrets
      - name: Build debug APK (Fork Configuration)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: omniland-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
